<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO -->
    <title>Vortex Labs — Creative Technology Conglomerate | Video, Web & App Ventures</title>
    <meta name="description" content="Vortex Labs is a creative technology holding company operating three focused ventures in cinematic video production, product-grade app development, and premium web design. Headquartered globally." />

    <link rel="canonical" href="https://vortexlabsworld.com/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vortex Labs — One Vision. Every Medium." />
    <meta property="og:description" content="Vortex Labs is the parent company behind three world-class digital ventures spanning video, web, and app development." />
    <meta property="og:image" content="https://vortexlabsworld.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vortex Labs — Creative Technology Conglomerate" />
    <meta name="twitter:description" content="Three focused ventures. One unified vision. Video, web, and app — built to world-class standard." />
    <meta name="twitter:image" content="https://vortexlabsworld.com/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Figtree:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Vortex Labs",
          "url": "https://vortexlabsworld.com",
          "logo": "https://vortexlabsworld.com/logo.png",
          "description": "Vortex Labs is a creative technology conglomerate operating ventures in video production, web development, and app development.",
          "foundingDate": "2023",
          "sameAs": [
            "https://twitter.com/vortexlabs",
            "https://linkedin.com/company/vortexlabs",
            "https://instagram.com/vortexlabs"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Vortex Labs Ventures",
            "itemListElement": [
              {"@type": "Offer", "name": "Video Production", "description": "Cinematic brand films, documentaries, and content production"},
              {"@type": "Offer", "name": "Web Development", "description": "Premium website design and development for brands"},
              {"@type": "Offer", "name": "App Development", "description": "iOS, Android, and SaaS product development"}
            ]
          }
        },
        {
          "@type": "WebSite",
          "url": "https://vortexlabsworld.com",
          "name": "Vortex Labs",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://vortexlabsworld.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What does Vortex Labs do?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Vortex Labs is a creative technology holding company that operates three focused ventures: Vortex Pictures (video production), Vortex Web (website design and development), and Vortex Apps (mobile and web application development)."
              }
            },
            {
              "@type": "Question",
              "name": "How can I work with Vortex Labs?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You can reach Vortex Labs directly at info@vortexlabsworld.com or through the contact form. Projects are routed to the appropriate venture based on your needs."
              }
            },
            {
              "@type": "Question",
              "name": "Does Vortex Labs work with startups or only enterprise clients?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Vortex Labs works with both ambitious startups and established enterprises. Each venture selects projects based on creative fit and scope, not company size."
              }
            }
          ]
        }
      ]
    }
    </script>
    
    <!-- AI Crawlability -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
  </head>
  <body class="bg-[#080808] text-[#F0EDE8] antialiased">
